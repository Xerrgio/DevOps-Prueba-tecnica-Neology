services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-parking}
      POSTGRES_USER: ${POSTGRES_USER:-parking}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - parking_postgres_data:/var/lib/postgresql/data
    networks:
      - parking-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    build:
      context: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      DB_URL: jdbc:postgresql://database:5432/${POSTGRES_DB:-parking}
      DB_USERNAME: ${POSTGRES_USER:-parking}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      FRONTEND_URL: http://localhost:${FRONTEND_PORT:-4200}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      database:
        condition: service_healthy
    networks:
      - parking-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O - http://localhost:8080/actuator/health | grep UP || exit 1"
        ]
      interval: 5s
      timeout: 3s
      retries: 18
      start_period: 20s
    restart: unless-stopped
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build:
      context: ./frontend
    ports:
      - "${FRONTEND_PORT:-4200}:8080"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - parking-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O /dev/null http://localhost:8080/ || exit 1"
        ]
      interval: 10s
      timeout: 3s
      retries: 6
    restart: unless-stopped
    logging:
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  parking_postgres_data:

networks:
  parking-network:
    driver: bridge