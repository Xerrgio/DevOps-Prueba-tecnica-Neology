name: CI

on:
  push:
    branches:
      - main
      - candidato/**
  pull_request:
  workflow_dispatch:



jobs:

  verify:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Verify permissions
        run: chmod +x scripts/verify.sh

      - name: Run validation
        run: ./scripts/verify.sh

  docker:

    needs: verify

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Backend Image
        run: docker build -t parking-backend:latest ./backend

      - name: Build Frontend Image
        run: docker build -t parking-frontend:latest ./frontend

  security:

  needs: verify

  runs-on: ubuntu-latest

  steps:

    - name: Checkout
      uses: actions/checkout@v4

    - name: Trivy Scan
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: fs
        severity: HIGH,CRITICAL
        format: table
        ignore-unfixed: true
        exit-code: 0
